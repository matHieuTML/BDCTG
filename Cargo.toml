[package]
name = "solimouv"
version = "0.1.0"
edition = "2021"
authors = ["Mathieu <gaucher.mathieu@icloud.com>"]
description = "PWA de communication pour le festival Solimouv' — hackathon BDCTG"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# --- Leptos core ---
# Note: on n'active PAS la feature "nightly" de Leptos car elle déclenche
# `feature(unsized_const_params)` dans tachys v0.1.9 qui est cassé avec rustc 1.97 nightly.
# On utilise l'API stable (`.get()` / `.set()` sur les signals).
leptos = { version = "0.7" }
leptos_router = { version = "0.7" }
leptos_meta = { version = "0.7" }

# --- Backend SSR (optional, gated by "ssr" feature) ---
leptos_axum = { version = "0.7", optional = true }
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "trace"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
dotenvy = { version = "0.15", optional = true }
bcrypt = { version = "0.16", optional = true }
qrcode = { version = "0.14", optional = true }

# --- Shared (client + server) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
uuid = { version = "1", features = ["v4", "serde", "js"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location"] }

[features]
hydrate = ["leptos/hydrate"]
ssr = [
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:sqlx",
    "dep:chrono",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:dotenvy",
    "dep:bcrypt",
    "dep:qrcode",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.leptos]
output-name = "solimouv"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "0.0.0.0:3000"
reload-port = 3001
browserquery = "defaults"
watch = false
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
