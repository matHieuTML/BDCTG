app = "solimouv-spike"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  LEPTOS_SITE_ADDR = "0.0.0.0:3000"
  RUST_LOG = "solimouv=info,tower_http=info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
